spring.application.name=DesignPattern
# ===============================
# CONFIGURAÇÃO DO SERVIDOR
# ===============================
server.port=8080

# ===============================
# CONFIGURAÇÃO DO H2 DATABASE
# ===============================
# Define a URL do banco em memória (chamamos de "checkoutdb")
spring.datasource.url=jdbc:h2:mem:checkoutdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ===============================
# CONFIGURAÇÃO DO SPRING DATA JPA / HIBERNATE
# ===============================
# Dialeto específico para o H2
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ddl-auto=update faz com que o Spring crie as tabelas automaticamente baseado nas suas classes @Entity
spring.jpa.hibernate.ddl-auto=update

# Mostra no console os comandos SQL que o Hibernate está executando (ótimo para estudos)
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


api.security.token.secret=PALMEIRAS-MAIOR-DO-BRASIL